# Tiny Tapeout project information
project:
  title:        "AES-128 Pipelined Encryption Core"
  author:       "Jeng Horng Lau / ECE4063 Group"
  discord:      "jenghorng"
  description:  "AES-128 encryption core with byte-serial Tiny Tapeout wrapper"
  language:     "Verilog"
  clock_hz:     10000000

  # Start with 1x1. If hardening fails due to area, increase this if allowed.
  tiles: "4x2"

  top_module:  "tt_um_aes_project"

  # Source files must be inside ./src
  source_files:
    - tt_um_aes_project.v
    - aes_top.v
    - addroundkey.v
    - subbytes.v
    - ShiftRows.v
    - MixColumns.v

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "data_byte_in[0]"
  ui[1]: "data_byte_in[1]"
  ui[2]: "data_byte_in[2]"
  ui[3]: "data_byte_in[3]"
  ui[4]: "data_byte_in[4]"
  ui[5]: "data_byte_in[5]"
  ui[6]: "data_byte_in[6]"
  ui[7]: "data_byte_in[7]"

  # Outputs
  uo[0]: "ciphertext_byte_out[0]"
  uo[1]: "ciphertext_byte_out[1]"
  uo[2]: "ciphertext_byte_out[2]"
  uo[3]: "ciphertext_byte_out[3]"
  uo[4]: "ciphertext_byte_out[4]"
  uo[5]: "ciphertext_byte_out[5]"
  uo[6]: "ciphertext_byte_out[6]"
  uo[7]: "ciphertext_byte_out[7]"

  # Bidirectional pins
  uio[0]: "byte_index[0]"
  uio[1]: "byte_index[1]"
  uio[2]: "byte_index[2]"
  uio[3]: "byte_index[3]"
  uio[4]: "select_plaintext"
  uio[5]: "write_enable"
  uio[6]: "load_key_cmd"
  uio[7]: "start_encrypt_cmd"

# Do not change!
yaml_version: 6
